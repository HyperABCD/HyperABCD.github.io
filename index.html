<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature | Contrat Location Chalet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca; --bg: #f1f5f9;
            --card: #ffffff; --text: #1e293b; --text-muted: #64748b; --border: #e2e8f0;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 2rem; }
        .main-container { display: grid; grid-template-columns: 1fr 380px; gap: 30px; width: 100%; max-width: 1100px; }
        #pdf-container { background: #cbd5e1; height: 80vh; overflow-y: auto; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        canvas { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); background: white; border-radius: 4px; max-width: 100%; }
        .side-panel { background: var(--card); padding: 30px; border-radius: 16px; height: fit-content; border: 1px solid var(--border); position: sticky; top: 20px; }
        .input-group { margin-bottom: 24px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 10px; }
        input[type="email"] { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 10px; box-sizing: border-box; }
        #signature-pad { border: 2px dashed var(--border); border-radius: 12px; background: #fcfcfc; cursor: crosshair; width: 100%; height: 150px; display: block; }
        .btn-primary { background: var(--primary); color: white; width: 100%; padding: 14px; border: none; border-radius: 10px; cursor: pointer; }
        .btn-primary:disabled { background: #cbd5e1; }
        #status { font-size: 0.85rem; margin-top: 15px; text-align: center; color: var(--primary); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Contrat de location</h1>
        <p>Veuillez lire et signer le document ci-contre.</p>
    </div>

    <div class="main-container">
        <div id="pdf-container">
            <p>Chargement du contrat...</p>
        </div>

        <div class="side-panel">
            <div class="checkbox-group">
                <input type="checkbox" id="attest-check" onchange="toggleButton()">
                <label for="attest-check">J'accepte les termes du contrat.</label>
            </div>
            <div class="input-group">
                <label for="user-email">Votre adresse courriel</label>
                <input type="email" id="user-email" placeholder="nom@exemple.com">
            </div>
            <label>Votre signature</label>
            <canvas id="signature-pad"></canvas>
            <button class="btn-secondary" style="margin-top:10px" onclick="clearSignature()">Effacer</button>
            <div class="actions">
                <button class="btn-primary" id="btn-submit" onclick="processPDF()" disabled>Signer et terminer</button>
            </div>
            <p id="status"></p>
        </div>
    </div>

    <script>
        // 1. Initialisation EmailJS
        (function(){
            emailjs.init("xbWfD_ssoTa1lWfh-"); // <-- REMPLACEZ PAR VOTRE CLÉ PUBLIQUE
        })();

        // 2. Configuration PDF.js
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        const PDF_URL = 'contrat.pdf'; 
        let originalBytes = null;
        const pdfContainer = document.getElementById('pdf-container');
        const sigCanvas = document.getElementById('signature-pad');
        const sigCtx = sigCanvas.getContext('2d');
        let drawing = false;

        // Fonction utilitaire pour convertir le PDF en Base64 pour EmailJS
        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
            return window.btoa(binary);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(PDF_URL);
                if (!response.ok) throw new Error("PDF introuvable.");
                originalBytes = await response.arrayBuffer();
                loadPdf(originalBytes);
            } catch (err) { pdfContainer.innerHTML = `<p style="color:red;">Erreur: ${err.message}</p>`; }
        });

        async function loadPdf(bytes) {
            const pdf = await pdfjsLib.getDocument({data: bytes.slice(0)}).promise;
            pdfContainer.innerHTML = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const canvas = document.createElement('canvas');
                const viewport = page.getViewport({scale: 1.2});
                canvas.height = viewport.height; canvas.width = viewport.width;
                pdfContainer.appendChild(canvas);
                await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
            }
        }

        // Gestion signature
        const getPos = (e) => {
            const rect = sigCanvas.getBoundingClientRect();
            const cx = e.clientX || e.touches?.[0].clientX;
            const cy = e.clientY || e.touches?.[0].clientY;
            return { x: cx - rect.left, y: cy - rect.top };
        };

        const start = (e) => { drawing = true; sigCtx.beginPath(); const p = getPos(e); sigCtx.moveTo(p.x, p.y); };
        const move = (e) => { if(!drawing) return; const p = getPos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); };
        
        sigCanvas.addEventListener('mousedown', start);
        window.addEventListener('mouseup', () => drawing = false);
        sigCanvas.addEventListener('mousemove', move);
        sigCanvas.addEventListener('touchstart', (e) => { start(e); e.preventDefault(); });
        sigCanvas.addEventListener('touchmove', (e) => { move(e); e.preventDefault(); });

        function clearSignature() { sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height); }
        function toggleButton() { document.getElementById('btn-submit').disabled = !document.getElementById('attest-check').checked; }

        async function processPDF() {
            const emailInput = document.getElementById('user-email').value;
            const status = document.getElementById('status');
            if (!emailInput.includes('@')) { alert("Courriel invalide"); return; }
            status.innerText = "Traitement et envoi...";
            
            try {
                const pdfDoc = await PDFLib.PDFDocument.load(originalBytes.slice(0));
                const pages = pdfDoc.getPages();
                const lastPage = pages[pages.length - 1];
                const sigImage = await pdfDoc.embedPng(sigCanvas.toDataURL('image/png'));
                
                lastPage.drawImage(sigImage, { x: lastPage.getWidth() - 200, y: 80, width: 150, height: 70 });
                const pdfBytes = await pdfDoc.save();
                
                // Envoi EmailJS
                await emailjs.send("service_5ejrxoo", "service_5ejrxoo", {
                    user_email: emailInput,
                    pdf_base64: arrayBufferToBase64(pdfBytes) 
                });

                // Téléchargement local
                const blob = new Blob([pdfBytes], { type: "application/pdf" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "contrat_signe.pdf";
                link.click();

                status.innerText = "Succès ! Le contrat a été envoyé par mail.";
            } catch (err) {
                console.error(err);
                status.innerText = "Erreur : " + err.message;
            }
        }
    </script>
</body>
</html>
